spring:
  application:
    name: member-regions-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# 동네 인증 정책 (환경별로 덮어쓸 수 있음)
member-regions:
  policy:
    max-regions-per-member: ${MEMBER_REGIONS_MAX_PER_MEMBER:2}
    verification-radius-meters: ${MEMBER_REGIONS_VERIFICATION_RADIUS_METERS:3000}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # instance-id는 EurekaInstancePortCustomizer에서 실제 할당 포트로 설정 (예: member-regions-service:51234)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
